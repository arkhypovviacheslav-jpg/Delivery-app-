<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DostavaGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center items-center p-4">

  <div id="app" class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl overflow-hidden border border-slate-700 min-h-[600px] flex flex-col">
    <!-- Шапка -->
    <header class="bg-slate-900 p-4 border-b border-slate-700 flex justify-between items-center">
      <h1 class="text-xl font-bold text-yellow-500">DostavaGo</h1>
      <span id="user-info" class="text-xs text-slate-400"></span>
    </header>

    <!-- Экран Авторизации/Регистрации -->
    <div id="auth-screen" class="p-6 flex-1 flex flex-col justify-center">
      <div id="auth-forms">
        <h2 class="text-2xl font-bold text-center mb-6" id="auth-title">Вход для клиента</h2>
        
        <!-- Форма Входа -->
        <form id="login-form" class="space-y-4">
          <input type="email" id="login-email" placeholder="Email" required class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600 focus:outline-none focus:border-yellow-500">
          <input type="password" id="login-pass" placeholder="Пароль" required class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600 focus:outline-none focus:border-yellow-500">
          <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-900 font-bold p-3 rounded-lg">Войти</button>
          <p class="text-center text-sm text-slate-400 mt-4">Нет аккаунта? <a href="#" id="to-register" class="text-yellow-500 underline">Зарегистрироваться</a></p>
        </form>

        <!-- Шаг 1 Регистрации: Ввод Email -->
        <form id="reg-step-1" class="space-y-4 hidden">
          <input type="email" id="reg-email" placeholder="Ваш Email" required class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600 focus:outline-none focus:border-yellow-500">
          <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-900 font-bold p-3 rounded-lg">Получить код на Email</button>
          <p class="text-center text-sm text-slate-400 mt-4">Уже есть аккаунт? <a href="#" id="to-login" class="text-yellow-500 underline">Войти</a></p>
        </form>

        <!-- Шаг 2 Регистрации: Ввод Кода и Данных -->
        <form id="reg-step-2" class="space-y-3 hidden">
          <p class="text-xs text-yellow-400 text-center">Код подтверждения отправлен на вашу почту!</p>
          <input type="text" id="reg-code" placeholder="6-значный код из письма" required class="w-full p-3 bg-slate-700 rounded-lg text-yellow-400 font-bold text-center border border-slate-600">
          <input type="text" id="reg-name" placeholder="Имя и Фамилия" required class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600">
          <input type="tel" id="reg-phone" placeholder="Номер телефона (+48...)" required class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600">
          <input type="password" id="reg-pass" placeholder="Придумайте пароль" required class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600">
          <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-900 font-bold p-3 rounded-lg">Завершить регистрацию</button>
        </form>
      </div>

      <div class="mt-8 text-center border-t border-slate-700 pt-4">
        <button id="courier-login-btn" class="text-xs text-slate-400 underline hover:text-white">Вход для курьера</button>
      </div>
    </div>

    <!-- Экран Клиента -->
    <div id="client-screen" class="p-6 flex-1 flex-col hidden">
      <h3 class="text-lg font-bold mb-4 text-yellow-500">Создать новый заказ</h3>
      <form id="order-form" class="space-y-3 mb-6">
        <textarea id="order-items" placeholder="Что нужно купить/доставить?" required class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600 h-20"></textarea>
        <input type="text" id="order-from" placeholder="Откуда (магазин / адрес)" class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600">
        <input type="text" id="order-to" placeholder="Куда (ваш адрес)" required class="w-full p-3 bg-slate-700 rounded-lg text-white border border-slate-600">
        <button type="submit" class="w-full bg-yellow-500 text-slate-900 font-bold p-3 rounded-lg">Оформить заказ</button>
      </form>
      <h3 class="text-md font-bold mb-2">Мои заказы:</h3>
      <div id="client-orders-list" class="space-y-2 flex-1 overflow-y-auto max-h-48"></div>
    </div>

    <!-- Экран Курьера -->
    <div id="courier-screen" class="p-6 flex-1 flex-col hidden">
      <h3 class="text-lg font-bold mb-4 text-yellow-500">Список заказов клиентов</h3>
      <div id="courier-orders-list" class="space-y-3 flex-1 overflow-y-auto"></div>
    </div>

    <!-- Экран Чата -->
    <div id="chat-screen" class="flex-1 flex flex-col hidden">
      <div class="p-3 bg-slate-700 flex justify-between items-center border-b border-slate-600">
        <button id="back-from-chat" class="text-xs text-yellow-500 font-bold">← Назад</button>
        <span id="chat-title" class="text-xs font-bold"></span>
      </div>
      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 max-h-80"></div>
      <form id="chat-form" class="p-3 bg-slate-900 border-t border-slate-700 flex gap-2 items-center">
        <label class="cursor-pointer text-slate-400 hover:text-yellow-500 p-2">
          📷
          <input type="file" id="chat-file" accept="image/*" class="hidden">
        </label>
        <input type="text" id="chat-input" placeholder="Сообщение..." class="flex-1 p-2 bg-slate-800 rounded-lg text-white border border-slate-700 text-sm">
        <button type="submit" class="bg-yellow-500 text-slate-900 font-bold px-4 py-2 rounded-lg text-sm">Send</button>
      </form>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://delivery-app-bnst.onrender.com';
    const socket = io(BACKEND_URL);

    let currentUser = null;
    let activeOrderId = null;

    // Элементы
    const authScreen = document.getElementById('auth-screen');
    const clientScreen = document.getElementById('client-screen');
    const courierScreen = document.getElementById('courier-screen');
    const chatScreen = document.getElementById('chat-screen');

    const loginForm = document.getElementById('login-form');
    const regStep1 = document.getElementById('reg-step-1');
    const regStep2 = document.getElementById('reg-step-2');

    document.getElementById('to-register').onclick = () => {
      loginForm.classList.add('hidden');
      regStep1.classList.remove('hidden');
      document.getElementById('auth-title').innerText = 'Регистрация';
    };
    document.getElementById('to-login').onclick = () => {
      regStep1.classList.add('hidden');
      loginForm.classList.remove('hidden');
      document.getElementById('auth-title').innerText = 'Вход для клиента';
    };

    // 1. Отправка кода на почту
    regStep1.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const res = await fetch(`${BACKEND_URL}/api/auth/send-email-code`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.success) {
        regStep1.classList.add('hidden');
        regStep2.classList.remove('hidden');
      } else {
        alert(data.error || "Ошибка отправки кода");
      }
    };

    // 2. Подтверждение кода и регистрация
    regStep2.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const code = document.getElementById('reg-code').value;
      const fullName = document.getElementById('reg-name').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-pass').value;

      const res = await fetch(`${BACKEND_URL}/api/auth/register`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, code, fullName, phone, password })
      });
      const data = await res.json();
      if (data.success) {
        alert("Регистрация успешна! Теперь войдите.");
        location.reload();
      } else {
        alert(data.error);
      }
    };

    // Вход
    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-pass').value;

      const res = await fetch(`${BACKEND_URL}/api/auth/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        openApp();
      } else {
        alert(data.error);
      }
    };

    // Вход для курьера
    document.getElementById('courier-login-btn').onclick = () => {
      const pass = prompt("Пароль курьера:");
      if (pass === 'admin2771') {
        currentUser = { name: 'Вячеслав Архипов (Курьер)', role: 'courier' };
        openApp();
      } else {
        alert("Неверный пароль");
      }
    };

    function openApp() {
      authScreen.classList.add('hidden');
      document.getElementById('user-info').innerText = currentUser.name;
      if (currentUser.role === 'courier') {
        courierScreen.classList.remove('hidden');
        loadCourierOrders();
      } else {
        clientScreen.classList.remove('hidden');
        loadClientOrders();
      }
    }

    // Создание заказа
    document.getElementById('order-form').onsubmit = async (e) => {
      e.preventDefault();
      const items = document.getElementById('order-items').value;
      const fromAddress = document.getElementById('order-from').value;
      const toAddress = document.getElementById('order-to').value;

      await fetch(`${BACKEND_URL}/api/orders`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          userEmail: currentUser.email,
          userPhone: currentUser.phone,
          userName: currentUser.name,
          items, fromAddress, toAddress
        })
      });
      document.getElementById('order-items').value = '';
      loadClientOrders();
    };

    async function loadClientOrders() {
      const res = await fetch(`${BACKEND_URL}/api/orders/user/${currentUser.email}`);
      const orders = await res.json();
      const list = document.getElementById('client-orders-list');
      list.innerHTML = orders.map(o => `
        <div onclick="openChat('${o.id}')" class="p-3 bg-slate-700 rounded-lg cursor-pointer hover:bg-slate-600 flex justify-between">
          <div>
            <div class="font-bold text-sm">${o.items}</div>
            <div class="text-xs text-slate-400">Статус: ${o.status}</div>
          </div>
          <span class="text-xs text-yellow-500 font-bold">Чат 💬</span>
        </div>
      `).join('');
    }

    async function loadCourierOrders() {
      const res = await fetch(`${BACKEND_URL}/api/orders`);
      const orders = await res.json();
      const list = document.getElementById('courier-orders-list');
      list.innerHTML = orders.map(o => `
        <div class="p-3 bg-slate-700 rounded-lg space-y-1">
          <div class="font-bold text-yellow-400">${o.items}</div>
          <div class="text-xs">👤 Клиент: ${o.user_name} (${o.user_phone})</div>
          <div class="text-xs text-slate-300">📍 Доставить: ${o.to_address}</div>
          <button onclick="openChat('${o.id}')" class="w-full mt-2 bg-yellow-500 text-slate-900 text-xs font-bold py-1 rounded">Открыть чат с клиентом</button>
        </div>
      `).join('');
    }

    // Чат
    async function openChat(orderId) {
      activeOrderId = orderId;
      clientScreen.classList.add('hidden');
      courierScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      document.getElementById('chat-title').innerText = `Чат по заказу ${orderId}`;
      
      socket.emit('join_order', orderId);

      const res = await fetch(`${BACKEND_URL}/api/messages/${orderId}`);
      const msgs = await res.json();
      const box = document.getElementById('chat-messages');
      box.innerHTML = msgs.map(renderMsg).join('');
    }

    document.getElementById('back-from-chat').onclick = () => {
      chatScreen.classList.add('hidden');
      if (currentUser.role === 'courier') courierScreen.classList.remove('hidden');
      else clientScreen.classList.remove('hidden');
    };

    function renderMsg(m) {
      return `
        <div class="bg-slate-700 p-2 rounded-lg text-sm max-w-[80%] ${m.sender === currentUser.name ? 'ml-auto bg-yellow-900/40 border border-yellow-500/30' : ''}">
          <div class="text-[10px] text-yellow-500 font-bold">${m.sender}</div>
          ${m.text ? `<div>${m.text}</div>` : ''}
          ${m.photo_url ? `<img src="${m.photo_url}" class="mt-1 rounded max-h-40">` : ''}
        </div>
      `;
    }

    document.getElementById('chat-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const fileInput = document.getElementById('chat-file');
      let photoUrl = null;

      if (fileInput.files[0]) {
        photoUrl = await new Promise(res => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.readAsDataURL(fileInput.files[0]);
        });
      }

      if (input.value || photoUrl) {
        socket.emit('send_message', {
          orderId: activeOrderId,
          sender: currentUser.name,
          text: input.value,
          photoUrl
        });
        input.value = '';
        fileInput.value = '';
      }
    };

    socket.on('new_message', (m) => {
      if (m.order_id === activeOrderId) {
        const box = document.getElementById('chat-messages');
        box.innerHTML += renderMsg(m);
        box.scrollTop = box.scrollHeight;
      }
    });
  </script>
</body>
</html>
